name: Build maitri-dev for edge

# Every push to maitrios/maitri main (via its notify-pkgs.yml) becomes a
# maitri-dev + maitri-settings-dev build published to the edge channel. The
# six-hourly schedule is the fallback when a dispatch is missed.

on:
  repository_dispatch:
    types: [maitri-main-push]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-edge
  cancel-in-progress: false

jobs:
  build-dev:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the maitri commit to build
        id: sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pacman -Syu --noconfirm --needed git github-cli jq
          sha="${{ github.event.client_payload.sha }}"
          [[ -n $sha ]] || sha=$(git ls-remote https://github.com/maitrios/maitri.git refs/heads/main | cut -f1)
          short=${sha:0:7}
          # A listing that fails must fail the job: guessing "not built yet"
          # would spend a rebuild and a publish on an already-drained bucket.
          assets=$(bash .github/release-api.sh list edge)
          current=$(cut -f1 <<<"$assets" | grep -oE '^maitri-dev-[^ ]*\.g[0-9a-f]{7}' | grep -oE 'g[0-9a-f]{7}$' | head -1 || true)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [[ $current == "g$short" ]]; then
            echo "edge already carries maitri-dev at $short"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the dev pair
        if: steps.sha.outputs.skip != 'true'
        run: |
          pacman -Syu --noconfirm --needed base-devel git sudo pacman-contrib
          useradd -m builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/builder
          install -d -o builder /work/repo
          cp -r pkgbuilds/maitri-settings-dev pkgbuilds/maitri-dev /work/
          chown -R builder:builder /work
          # The repos below exist for this step alone; the publish step syncs
          # pacman again after the local database is gone.
          cp -a /etc/pacman.conf /work/pacman.conf.pristine
          printf '\n[maitri-local]\nSigLevel = Never\nServer = file:///work/repo\n' >> /etc/pacman.conf
          # maitri-dev depends on packages only this channel ships (maitri-keyring,
          # maitri-fish, the UI font, the limine hooks). Listed after maitri-local
          # so the maitri-settings-dev built here wins over the copy already on edge.
          printf '\n[maitri]\nSigLevel = Never\nServer = https://github.com/%s/releases/download/edge\n' "${{ github.repository }}" >> /etc/pacman.conf
          # pacman refuses every transaction while a configured repo has no
          # database, so seed an empty one and sync before the first makepkg -s
          # asks it to install build dependencies.
          sudo -u builder repo-add /work/repo/maitri-local.db.tar.gz >/dev/null 2>&1
          pacman -Sy >/dev/null
          # maitri-settings-dev first: maitri-dev depends on it, and the local repo
          # is how makepkg -s finds a package that is not published yet.
          sudo -u builder bash -euo pipefail -c '
            for p in maitri-settings-dev maitri-dev; do
              cd /work/$p
              MAITRI_DEV_COMMIT="${{ steps.sha.outputs.sha }}" makepkg -s --noconfirm --noprogressbar --skippgpcheck
              cp ./*.pkg.tar.zst /work/repo/
              repo-add /work/repo/maitri-local.db.tar.gz ./*.pkg.tar.zst >/dev/null
              sudo pacman -Sy >/dev/null
            done
          '
          rm -f /work/repo/maitri-local.*
          mv /work/pacman.conf.pristine /etc/pacman.conf

      - name: Publish to edge
        if: steps.sha.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          pacman -Syu --noconfirm --needed github-cli jq gnupg sudo
          # Must not fail quietly: publish-channel.sh deletes whatever edge
          # has that is not staged in /work/repo.
          bash .github/release-api.sh fetch edge /work/repo '*.pkg.tar.zst' '*.sig'
          useradd -m publisher
          chown -R publisher:publisher /work/repo
          printf '%s' "${{ secrets.MAITRI_GPG_PRIVATE_KEY }}" | sudo -u publisher gpg --batch --import
          install -o publisher -m 755 .github/publish-channel.sh .github/release-api.sh /work/
          sudo -u publisher env GH_TOKEN="$GH_TOKEN" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" bash /work/publish-channel.sh edge

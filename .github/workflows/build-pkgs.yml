name: Build maitri packages

# Builds every PKGBUILD incrementally (the published stable release is the
# cache), then publishes the result as the [maitri] pacman repository on the
# `stable` and `edge` GitHub Releases. The dev pair (maitri-dev,
# maitri-settings-dev) is built by build-edge-dev.yml and only ever lands on
# edge. Signing happens in the publish job, so the GPG key never shares a
# job with third-party build() code.

on:
  push:
    branches: [main]
    paths: ['pkgbuilds/**', '.github/**']
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Rebuild every package from scratch (ignore the published cache)"
        type: boolean
        default: false
      packages:
        description: "Only build these packages (space separated); empty builds everything"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: build-pkgs
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        lane: [core, heavy]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space for the heavy lane
        if: matrix.lane == 'heavy'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Seed build cache from the published stable release
        if: ${{ github.event.inputs.force_rebuild != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p work/repo
          if gh release download stable -R "${{ github.repository }}" -D work/repo -p '*.pkg.tar.zst' 2>/dev/null; then
            echo "seeded $(ls work/repo/*.pkg.tar.zst | wc -l) cached packages"
          else
            echo "no published release yet — full build"
          fi

      - name: Build packages (${{ matrix.lane }} lane)
        run: |
          mkdir -p work/repo
          docker run --rm \
            -v "$PWD/pkgbuilds:/work/pkgbuilds-src:ro" \
            -v "$PWD/work:/work/out" \
            -v "$PWD/.github/build-packages.sh:/work/build-packages.sh:ro" \
            -e FORCE="${{ github.event.inputs.force_rebuild }}" \
            -e LANE="${{ matrix.lane }}" \
            -e ONLY="${{ github.event.inputs.packages }}" \
            archlinux:latest bash -euo pipefail -c '
              sed -i "s/^#\?ParallelDownloads.*/ParallelDownloads = 10/" /etc/pacman.conf
              pacman -Syu --noconfirm --needed base-devel git sudo pacman-contrib
              printf "MAKEFLAGS=\"-j%s\"\n" "$(nproc)" >> /etc/makepkg.conf
              useradd -m builder
              printf "builder ALL=(ALL) NOPASSWD: ALL\n" > /etc/sudoers.d/builder
              # makepkg needs a writable copy of the recipes and a repo dir it owns.
              cp -a /work/out/repo /work/repo
              cp -r /work/pkgbuilds-src /work/pkgbuilds
              touch /work/built.txt
              chown -R builder:builder /work/repo /work/pkgbuilds /work/built.txt
              printf "\n[maitri-local]\nSigLevel = Never\nServer = file:///work/repo\n" >> /etc/pacman.conf
              status=0
              sudo -u builder env FORCE="$FORCE" LANE="$LANE" ONLY="$ONLY" bash /work/build-packages.sh || status=$?
              # Hand back only what this run built. Artifact paths cannot contain
              # ":" (pacman epoch); publish-channel.sh expects the "." spelling.
              mkdir -p /work/out/built
              while read -r pkg; do cp "/work/repo/$pkg" "/work/out/built/${pkg//:/.}"; done < /work/built.txt
              cp /work/built.txt /work/out/built.txt
              exit $status
            '
          echo "built: $(cat work/built.txt | wc -l) packages"

      # One broken recipe must not throw away the rest of the lane; publish
      # takes whatever was built and the job still reports the failure.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: built-${{ matrix.lane }}
          path: work/built
          if-no-files-found: ignore
          retention-days: 3

  publish:
    needs: build
    if: ${{ always() && !cancelled() }}
    strategy:
      max-parallel: 1
      matrix:
        channel: [stable, edge]
    runs-on: ubuntu-latest
    container: archlinux:latest
    concurrency:
      group: publish-${{ matrix.channel }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Install publish tooling
        run: pacman -Syu --noconfirm --needed git github-cli pacman-contrib gnupg sudo

      - uses: actions/download-artifact@v4
        with:
          pattern: built-*
          path: built
          merge-multiple: true

      - name: Assemble the channel from its current assets plus what was built
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /work/repo
          gh release download "${{ matrix.channel }}" -R "${{ github.repository }}" -D /work/repo -p '*.pkg.tar.zst' 2>/dev/null || true
          if compgen -G 'built/*.pkg.tar.zst' >/dev/null; then cp built/*.pkg.tar.zst /work/repo/; fi
          echo "$(ls /work/repo/*.pkg.tar.zst 2>/dev/null | wc -l) packages staged for ${{ matrix.channel }}"
          # The release pair must move in lockstep.
          m=$(ls /work/repo/maitri-[0-9]*.pkg.tar.zst 2>/dev/null | sed -E 's/.*maitri-([0-9][^-]*-[0-9]+)-.*/\1/' | sort -V | tail -1)
          s=$(ls /work/repo/maitri-settings-[0-9]*.pkg.tar.zst 2>/dev/null | sed -E 's/.*maitri-settings-([0-9][^-]*-[0-9]+)-.*/\1/' | sort -V | tail -1)
          if [[ -n $m && -n $s && $m != "$s" ]]; then
            echo "::error::maitri ($m) and maitri-settings ($s) are out of lockstep"; exit 1
          fi

      - name: Sign and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          useradd -m publisher
          chown -R publisher:publisher /work/repo
          printf '%s' "${{ secrets.MAITRI_GPG_PRIVATE_KEY }}" | sudo -u publisher gpg --batch --import
          install -o publisher -m 755 .github/publish-channel.sh /work/publish-channel.sh
          sudo -u publisher env GH_TOKEN="$GH_TOKEN" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" PKGBUILDS_DIR="$PWD/pkgbuilds" bash /work/publish-channel.sh "${{ matrix.channel }}"
